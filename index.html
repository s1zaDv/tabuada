<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TabuadaPro | Gerador de Tabuada</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #151d30;
        color: white;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        width: 90%;
        max-width: 450px;
      }

      header {
        text-align: center;
        margin-bottom: 30px;
      }

      header h1 {
        font-size: 40px;
        color: #ffb454;
      }

      header p {
        color: #aab4c5;
        margin-top: 10px;
      }

      .calculator {
        background: #222e45;
        padding: 30px;
        border-radius: 15px;
      }

      h2 {
        margin-bottom: 25px;
      }

      label {
        display: block;
        margin-bottom: 10px;
      }

      input {
        width: 100%;
        padding: 14px;
        background: #151d30;
        border: 1px solid #45536d;
        border-radius: 7px;
        color: white;
        font-size: 16px;
      }

      button {
        width: 100%;
        padding: 14px;
        margin-top: 20px;
        background: #ffb454;
        color: #151d30;
        border: none;
        border-radius: 7px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        background: #ed9e3b;
      }

      #resultado {
        margin-top: 25px;
        background: #151d30;
        border-radius: 8px;
        padding: 15px;
        color: #ffb454;
        line-height: 2;
        text-align: center;
        font-size: 17px;
      }

      footer {
        text-align: center;
        margin-top: 25px;
        color: #aab4c5;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Tabuada</h1>
        <p>Gere tabuadas de maneira rápida e simples.</p>
      </header>

      <section class="calculator">
        <h2>Gerador de tabuada</h2>

        <label>Digite um número</label>
        <input type="number" id="numero" placeholder="Ex: 7" />

        <button onclick="mostrarTabuada()">Gerar tabuada</button>

        <div id="resultado"></div>
      </section>

      <footer>
        <p>Tabuada © 2026</p>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
